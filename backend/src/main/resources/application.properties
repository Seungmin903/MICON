spring.application.name=backend

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/micon?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 별도 프로필을 지정하지 않으면 로컬 환경을 기본으로 사용합니다.
spring.profiles.default=local

# 영속성 컨텍스트를 웹 계층까지 유지하지 않습니다.
spring.jpa.open-in-view=false

# Swagger UI와 OpenAPI 문서 표시 순서를 설정합니다.
springdoc.swagger-ui.path=/v1/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

spring.jpa.hibernate.ddl-auto=validate

# Authentication
auth.jwt.issuer=micon-backend
auth.jwt.secret=${JWT_SECRET}
auth.jwt.access-token-ttl=30m
auth.refresh-token-ttl=30d
auth.password-reset.code-ttl=10m
auth.password-reset.token-ttl=10m
auth.password-reset.max-attempts=5
auth.password-reset.mail-from=${MAIL_FROM:no-reply@micon.local}

# Password reset email (production must provide the SMTP environment variables)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

# AI service
ai.base-url=${AI_BASE_URL:http://localhost:8000}
ai.service-token=${AI_SERVICE_TOKEN:}
ai.voice-analysis-enabled=${AI_VOICE_ANALYSIS_ENABLED:false}
ai.voice-analysis-guide-version=${AI_VOICE_ANALYSIS_GUIDE_VERSION:v1}
ai.voice-analysis-download-url-ttl=${AI_VOICE_ANALYSIS_DOWNLOAD_URL_TTL:30m}
ai.song-fit-enabled=${AI_SONG_FIT_ENABLED:true}
ai.recommendation.base-url=${AI_RECOMMENDATION_BASE_URL:http://localhost:8788}
ai.recommendation.enabled=${AI_RECOMMENDATION_ENABLED:false}
ai.recommendation.service-token=${AI_RECOMMENDATION_SERVICE_TOKEN:${AI_SERVICE_TOKEN:}}
ai.recommendation.connect-timeout=${AI_RECOMMENDATION_CONNECT_TIMEOUT:3s}
ai.recommendation.read-timeout=${AI_RECOMMENDATION_READ_TIMEOUT:10s}
ai.recommendation.polling.enabled=${AI_RECOMMENDATION_POLLING_ENABLED:true}
ai.recommendation.polling.interval=${AI_RECOMMENDATION_POLL_INTERVAL:1500ms}
ai.recommendation.polling.initial-delay=${AI_RECOMMENDATION_POLL_INITIAL_DELAY:5s}
spring.servlet.multipart.max-file-size=${VOICE_RECORDING_MAX_SIZE:25MB}
spring.servlet.multipart.max-request-size=${VOICE_RECORDING_MAX_SIZE:25MB}
voice.storage.bucket=${VOICE_STORAGE_BUCKET:}
voice.storage.region=${VOICE_STORAGE_REGION:ap-northeast-2}
voice.storage.prefix=${VOICE_STORAGE_PREFIX:voice-recordings}
voice.storage.playback-url-ttl=${VOICE_STORAGE_PLAYBACK_URL_TTL:10m}
voice.storage.max-file-bytes=${VOICE_STORAGE_MAX_FILE_BYTES:26214400}
catalog.media.allowed-prefix=${CATALOG_MEDIA_ALLOWED_PREFIX:catalog/정영주/section-384-v1/vocals/}
catalog.media.download-url-ttl=${CATALOG_MEDIA_DOWNLOAD_URL_TTL:10m}

# Voice data policy (replace the unconfirmed defaults after the product policy is approved)
policy.voice-data.version=${VOICE_DATA_POLICY_VERSION:UNCONFIRMED}
policy.voice-data.collection-purpose=${VOICE_DATA_COLLECTION_PURPOSE:사용자의 음역·음색 분석과 노래 연습 결과 제공}
policy.voice-data.retention-period=${VOICE_DATA_RETENTION_PERIOD:정책 확정 전}
policy.voice-data.deletion-policy=${VOICE_DATA_DELETION_POLICY:사용자는 저장된 녹음과 음성 분석 데이터를 개별 또는 전체 삭제할 수 있습니다. 원본 녹음 저장이 꺼져 있으면 분석 완료 후 원본 녹음을 삭제합니다.}
