spring.docker.compose.file=../infra/compose/mysql.local.compose.yml
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.readiness.timeout=2m

# Local MySQL exposed by mysql.local.compose.yml.
# Environment variables still take precedence when IntelliJ supplies them.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/micon?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:micon}
spring.datasource.password=${DB_PASSWORD:micon-local}

# Development-only fallback. Production must provide JWT_SECRET.
auth.jwt.secret=${JWT_SECRET:micon-local-jwt-secret-at-least-32-bytes}
