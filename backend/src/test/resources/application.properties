spring.datasource.url=jdbc:h2:mem:micon;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

auth.jwt.issuer=micon-backend-test
auth.jwt.secret=micon-test-secret-key-with-32-bytes
auth.jwt.access-token-ttl=30m
auth.refresh-token-ttl=30d
auth.password-reset.code-ttl=10m
auth.password-reset.token-ttl=10m
auth.password-reset.max-attempts=5
auth.password-reset.mail-from=no-reply@micon.test
spring.mail.host=localhost
spring.mail.port=25
ai.recommendation.polling.enabled=false
