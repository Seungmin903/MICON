# MICON Android 버전 카탈로그. 모든 라이브러리/플러그인 버전은 이 파일에서만 관리한다.
#
# 출처
#  - Compose·Media3·Moshi 계열: PJT 프로토타입(2026-09-03)에서 빌드 검증된 조합
#  - 그 외(OkHttp, security-crypto, SDK 레벨, 테스트, 소셜 로그인): PickUs(S15P11B211)에서 검증된 조합
#  - 두 곳에서 버전이 다르면 Kotlin 2.2 / Compose 와 함께 빌드된 PJT 쪽을 택했다.

[versions]
# --- Build toolchain ---
agp = "9.3.2"                      # Kotlin 컴파일 내장(KGP 2.2.10). org.jetbrains.kotlin.android 플러그인을 추가하지 말 것
kotlin = "2.2.10"                  # AGP 내장 Kotlin 과 같은 버전이어야 Compose 컴파일러 플러그인이 맞는다
foojayResolver = "1.0.0"
desugarJdkLibs = "2.1.5"
compileSdk = "37"
targetSdk = "36"
minSdk = "24"                      # Android 7.0. Galaxy S10(API 28~31) 포함 구형 기기 지원

# --- AndroidX / Compose ---
coreKtx = "1.19.0"
appcompat = "1.7.1"
material = "1.14.0"                # XML 테마(Theme.Material3) 용
composeBom = "2025.06.01"
activityCompose = "1.10.1"
lifecycle = "2.9.1"
navigationCompose = "2.9.0"
securityCrypto = "1.1.0-alpha06"   # EncryptedSharedPreferences (토큰 저장)

# --- Media ---
media3 = "1.7.1"                   # ExoPlayer, 반주 스트리밍

# --- Network / JSON / Async ---
retrofit = "2.11.0"
okhttp = "4.12.0"
moshi = "1.15.2"                   # 리플렉션 어댑터. KSP 불필요
coroutines = "1.10.2"

# --- Image ---
coil = "2.7.0"                     # Compose 용 이미지 로더 (앨범 아트)

# --- Login (카탈로그에만 고정. 필요할 때 app/build.gradle.kts 에서 주석 해제) ---
kakaoSdk = "2.20.1"
playServicesAuth = "21.2.0"
naverOauth = "5.9.1"

# --- Test ---
junit = "4.13.2"
androidxJunit = "1.3.0"
espressoCore = "3.7.0"

[libraries]
# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }

# Compose (BOM 이 개별 버전을 정한다)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Media3 (ExoPlayer)
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }

# Network / JSON
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-moshi = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "retrofit" }
moshi-kotlin = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshi" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Image
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Login
kakao-user = { group = "com.kakao.sdk", name = "v2-user", version.ref = "kakaoSdk" }
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }
naver-oauth = { group = "com.navercorp.nid", name = "oauth", version.ref = "naverOauth" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[bundles]
compose = [
    "androidx-compose-ui", "androidx-compose-ui-graphics", "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3", "androidx-compose-material-icons",
    "androidx-activity-compose", "androidx-lifecycle-viewmodel-compose", "androidx-lifecycle-runtime-compose",
    "androidx-navigation-compose",
]
network = ["retrofit", "retrofit-converter-moshi", "moshi-kotlin", "kotlin-reflect", "okhttp", "okhttp-logging"]
media3 = ["androidx-media3-exoplayer", "androidx-media3-datasource-okhttp"]
login = ["kakao-user", "play-services-auth", "naver-oauth"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
