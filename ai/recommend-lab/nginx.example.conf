# Existing HTTPS server block에 검토 후 추가할 예시 실제 운영에는 아직 적용하지 않음
# 후행 slash는 상대 static/api 경로에 필수
location = /ai-lab {
    return 308 /ai-lab/;
}
location /ai-lab/ {
    proxy_pass http://127.0.0.1:8790/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 32k;
    # 기본 인증 또는 승인된 팀 SSO 필요 public 무인증 공개 금지
}
