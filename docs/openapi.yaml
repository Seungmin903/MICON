      x-work-status: "시작 전"
      x-backend-status: "미확인"
      x-frontend-status: "해당 없음"
      x-permission: "AI 서비스"
      x-auth-token: "서비스 토큰"
      responses:
        default:
          description: "응답 상태 코드와 스키마는 구현 시 확정"
  "/callbacks/practice-analyses":
    post:
      tags: ["연습 분석"]
      summary: "연습 평가 상태 및 결과 전달 API"
      description: "eventId·jobId·상태·진행 단계·결과 또는 오류·발생 시각 및 순서 정보를 전달한다. 중복·역순 이벤트를 검증하고 유실 시 재전송한다."
