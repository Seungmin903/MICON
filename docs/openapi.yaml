      tags: ["인증"]
      summary: "로그아웃 API"
      description: "현재 세션을 종료하고 해당 세션의 접근을 차단한다."
      operationId: "micon006"
      servers:
        - url: "{backendUrl}"
          description: "백엔드 서버"
          variables:
            backendUrl:
              default: "http://localhost:8080"
      security:
        - bearerAuth: []
      x-direction: "프 → 백"
      x-api-type: "API"
      x-work-status: "시작 전"
      x-backend-status: "미확인"
      x-frontend-status: "미확인"
      x-permission: "본인"
      x-auth-token: "Access Token"
      responses:
        default:
          description: "응답 상태 코드와 스키마는 구현 시 확정"
  "/auth/tokens/refresh":
    post:
      tags: ["인증"]
      summary: "인증 토큰 갱신 API"
      description: "유효한 갱신 토큰으로 인증 토큰을 갱신한다."
      operationId: "micon007"
