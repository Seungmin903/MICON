components:
  parameters:
    RecordingId:
      name: "recordingId"
      in: "path"
      required: true
      schema:
        type: "integer"
        format: "int64"
    AnalysisId:
      name: "analysisId"
      in: "path"
      required: true
      schema:
        type: "integer"
        format: "int64"
    VoiceAnalysisJobId:
      name: "jobId"
      in: "path"
      required: true
      schema:
        type: "string"
  schemas:
    RecordingDetail:
      type: "object"
      required: ["recordingId", "attemptNo", "mediaType", "keepOriginal", "uploadStatus", "createdAt"]
      properties:
        recordingId: { type: "integer", format: "int64" }
        attemptNo: { type: "integer" }
        mediaType: { type: "string" }
        fileBytes: { type: ["integer", "null"], format: "int64" }
        durationMs: { type: ["integer", "null"] }
        sampleRate: { type: ["integer", "null"] }
        keepOriginal: { type: "boolean" }
        uploadStatus:
          type: "string"
          enum: ["UPLOADING", "UPLOADED", "FAILED", "DELETE_PENDING", "DELETED"]
        deleteScheduledAt: { type: ["string", "null"], format: "date-time" }
        createdAt: { type: "string", format: "date-time" }
    RecordingDetailApiResponse:
      type: "object"
      required: ["code", "message", "data"]
      properties:
        code: { type: "string", example: "SUCCESS" }
        message: { type: "string" }
        data: { $ref: "#/components/schemas/RecordingDetail" }
    RecordingPageApiResponse:
      type: "object"
      required: ["code", "message", "data"]
      properties:
        code: { type: "string", example: "SUCCESS" }
        message: { type: "string" }
        data:
          type: "object"
          required: ["content", "page", "size", "totalElements", "totalPages"]
          properties:
            content:
              type: "array"
              items: { $ref: "#/components/schemas/RecordingDetail" }
            page: { type: "integer" }
            size: { type: "integer" }
            totalElements: { type: "integer", format: "int64" }
            totalPages: { type: "integer" }
    RecordingPlaybackApiResponse:
      type: "object"
      required: ["code", "message", "data"]
      properties:
        code: { type: "string", example: "SUCCESS" }
        message: { type: "string" }
        data:
          type: "object"
          required: ["recordingId", "contentUrl", "mediaType", "expiresAt"]
          properties:
            recordingId: { type: "integer", format: "int64" }
            contentUrl: { type: "string", format: "uri" }
            mediaType: { type: "string" }
            expiresAt: { type: "string", format: "date-time" }
    VoiceAnalysisSummary:
      type: "object"
      required: ["analysisId", "recordingId", "method", "status", "createdAt"]
      properties:
        analysisId: { type: "integer", format: "int64" }
        recordingId: { type: "integer", format: "int64" }
        songId: { type: ["integer", "null"], format: "int64" }
        method: { type: "string", enum: ["SCALE", "SONG"] }
        status: { type: "string", enum: ["READY", "RECORDING", "UPLOADING", "ANALYZING", "COMPLETED", "FAILED", "CANCELED", "INSUFFICIENT_DATA"] }
        qualityStatus: { type: ["string", "null"] }
        failureCode: { type: ["string", "null"] }
        failureReason: { type: ["string", "null"] }
        startedAt: { type: ["string", "null"], format: "date-time" }
        completedAt: { type: ["string", "null"], format: "date-time" }
        createdAt: { type: "string", format: "date-time" }
    VoiceAnalysisHistoryApiResponse:
      type: "object"
      required: ["code", "message", "data"]
      properties:
        code: { type: "string", example: "SUCCESS" }
        message: { type: "string" }
        data:
          type: "object"
          required: ["content", "page", "size", "totalElements", "totalPages"]
          properties:
            content: { type: "array", items: { $ref: "#/components/schemas/VoiceAnalysisSummary" } }
            page: { type: "integer" }
            size: { type: "integer" }
            totalElements: { type: "integer", format: "int64" }
            totalPages: { type: "integer" }
    VoiceAnalysisReportApiResponse:
      type: "object"
      required: ["code", "message", "data"]
      properties:
        code: { type: "string", example: "SUCCESS" }
        message: { type: "string" }
        data:
          type: "object"
          required: ["analysis"]
          properties:
            analysis: { $ref: "#/components/schemas/VoiceAnalysisSummary" }
            range: { type: ["object", "null"], description: "전체·안정·진성·가성 음역과 피치 지표" }
            timbre: { type: ["object", "null"], description: "음색 라벨·리듬·발음·응집도 지표. 내부 임베딩은 제외" }
    VoiceAnalysisCallbackRequest:
      type: "object"
      required: ["voiceAnalysisId", "jobId", "status", "measuredAt"]
      properties:
        voiceAnalysisId: { type: "integer", format: "int64" }
        jobId: { type: "string" }
        status: { type: "string", enum: ["COMPLETED", "FAILED", "INSUFFICIENT_DATA"] }
        analysisVersion: { type: ["string", "null"] }
        qualityStatus:
          type: ["string", "null"]
          enum: ["VALID", "NOISY", "CLIPPED", "INSUFFICIENT_VOICE", null]
        failureCode: { type: ["string", "null"] }
        failureReason: { type: ["string", "null"] }
        range:
          anyOf:
            - $ref: "#/components/schemas/VocalRangeResult"
            - type: "null"
        timbre:
          anyOf:
            - $ref: "#/components/schemas/VocalTimbreResult"
            - type: "null"
        measuredAt: { type: "string", format: "date-time" }
    VocalRangeResult:
      type: "object"
      properties:
        fullLowMidi: { type: ["number", "null"] }
        fullHighMidi: { type: ["number", "null"] }
        stableLowMidi: { type: ["number", "null"] }
        stableHighMidi: { type: ["number", "null"] }
        pitchMedianMidi: { type: ["number", "null"] }
        pitchAccuracyScore: { type: ["number", "null"] }
        pitchStabilityScore: { type: ["number", "null"] }
        pitchDistribution: { type: ["object", "array", "null"] }
        modalLowMidi: { type: ["number", "null"] }
        modalHighMidi: { type: ["number", "null"] }
        falsettoLowMidi: { type: ["number", "null"] }
        falsettoHighMidi: { type: ["number", "null"] }
        highNoteHoldSec: { type: ["number", "null"] }
        confidence: { type: ["number", "null"] }
        noteResults: { type: ["object", "array", "null"] }
    VocalTimbreResult:
      type: "object"
      properties:
        timbreLabel: { type: ["string", "null"] }
        timbreVector: { type: ["object", "array", "null"] }
        rhythmScore: { type: ["number", "null"] }
        pronunciationScore: { type: ["number", "null"] }
        confidence: { type: ["number", "null"] }
        explanation: { type: ["string", "null"] }
        validSingleSec: { type: ["number", "null"] }
        validChunkCount: { type: ["integer", "null"] }
        userEmbedding: { type: ["object", "array", "null"] }
        embeddingRef: { type: ["string", "null"] }
        chunkCohesion: { type: ["number", "null"] }
        observedCoreLowMidi: { type: ["number", "null"] }
        observedCoreHighMidi: { type: ["number", "null"] }
        observedMedianMidi: { type: ["number", "null"] }
        pitchHistogram: { type: ["object", "array", "null"] }
    VoiceAnalysisCallbackApiResponse:
      type: "object"
      required: ["code", "message", "data"]
      properties:
        code: { type: "string", example: "SUCCESS" }
        message: { type: "string" }
        data:
          type: "object"
          required: ["voiceAnalysisId", "status", "duplicate"]
          properties:
            voiceAnalysisId: { type: "integer", format: "int64" }
            status: { type: "string" }
            duplicate: { type: "boolean" }
    CreateVoiceAnalysisJobRequest:
      type: "object"
      required: ["voiceAnalysisId", "recordingUrl", "method", "guideVersion"]
      properties:
        voiceAnalysisId:
          type: "integer"
          format: "int64"
        recordingUrl:
          type: "string"
          format: "uri"
          description: "AI 서버가 제한 시간 동안 녹음을 내려받는 Presigned GET URL"
        method:
          type: "string"
          enum: ["SCALE", "SONG"]
        songId:
          type: ["integer", "null"]
          format: "int64"
        guideVersion:
          type: "string"
    CreateVoiceAnalysisJobResponse:
      type: "object"
      required: ["jobId", "status"]
      properties:
        jobId:
          type: "string"
        status:
          type: "string"
          example: "QUEUED"
    CreateVoiceAnalysisRequest:
      type: "object"
      required: ["recordingId", "method"]
      properties:
        recordingId:
          type: "integer"
          format: "int64"
        method:
          type: "string"
          enum: ["SCALE", "SONG"]
        songId:
          type: ["integer", "null"]
          format: "int64"
          description: "SONG 방식일 때 필수"
    VoiceAnalysisApiResponse:
      type: "object"
      required: ["code", "message", "data"]
      properties:
        code:
          type: "string"
          example: "SUCCESS"
        message:
          type: "string"
        data:
          $ref: "#/components/schemas/VoiceAnalysisStatusResponse"
    VoiceAnalysisStatusResponse:
      type: "object"
      required: ["analysisId", "recordingId", "method", "status", "createdAt"]
      properties:
        analysisId:
          type: "integer"
          format: "int64"
        recordingId:
          type: "integer"
          format: "int64"
        songId:
          type: ["integer", "null"]
          format: "int64"
        method:
          type: "string"
          enum: ["SCALE", "SONG"]
        status:
          type: "string"
          enum: ["READY", "RECORDING", "UPLOADING", "ANALYZING", "COMPLETED", "FAILED", "CANCELED", "INSUFFICIENT_DATA"]
        qualityStatus:
          type: ["string", "null"]
          enum: ["VALID", "NOISY", "CLIPPED", "INSUFFICIENT_VOICE", null]
        failureCode:
          type: ["string", "null"]
        failureReason:
          type: ["string", "null"]
        analysisVersion:
          type: ["string", "null"]
        startedAt:
          type: ["string", "null"]
          format: "date-time"
        completedAt:
          type: ["string", "null"]
          format: "date-time"
        createdAt:
          type: "string"
          format: "date-time"
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
    refreshTokenAuth:
      type: "apiKey"
      in: "header"
      name: "X-Refresh-Token"
    passwordResetAuth:
      type: "apiKey"
      in: "header"
      name: "X-Password-Reset-Token"
    serviceAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "백엔드와 AI 서버 간 통신용 서비스 토큰"
