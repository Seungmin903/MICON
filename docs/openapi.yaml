openapi: "3.1.0"
info:
  title: "MICON 통합 API"
  version: "1.0.0"
  description: "프론트엔드, 백엔드, AI 서버 간 API를 하나로 관리하는 통합 명세입니다. 요청·응답 상세 스키마와 상태 코드는 구현 과정에서 보완해야 합니다."
servers:
  - url: "{backendUrl}"
    description: "백엔드 서버"
    variables:
      backendUrl:
        default: "http://localhost:8080"
  - url: "{aiUrl}"
    description: "AI 서버"
    variables:
      aiUrl:
        default: "http://localhost:8000"
tags:
  - name: "개인정보"
  - name: "곡"
  - name: "곡 적합도"
  - name: "녹음"
  - name: "데이터 삭제"
  - name: "분석 리포트"
  - name: "선호 정보"
  - name: "설정"
  - name: "세트리스트"
  - name: "연습"
  - name: "연습 기록"
  - name: "연습 리포트"
  - name: "연습 분석"
  - name: "연습 준비"
  - name: "음성 데이터"
  - name: "음성 분석"
  - name: "음성 측정"
  - name: "음원 처리"
  - name: "인기차트"
  - name: "인증"
  - name: "찜"
  - name: "추천"
  - name: "회원"
paths:
  "/artists":
    get:
      tags: ["선호 정보"]
      summary: "선호 가수 검색 API"
      description: "선호 조사에서 선택할 가수를 검색한다."
      operationId: "micon001"
      servers:
        - url: "{backendUrl}"
          description: "백엔드 서버"
          variables:
            backendUrl:
              default: "http://localhost:8080"
      security:
        - bearerAuth: []
      x-direction: "프 → 백"
      x-api-type: "API"
      x-work-status: "시작 전"
      x-backend-status: "미확인"
      x-frontend-status: "미확인"
      x-permission: "회원"
      x-auth-token: "Access Token"
      responses:
        default:
          description: "응답 상태 코드와 스키마는 구현 시 확정"
  "/auth/password-reset-requests":
    post:
      tags: ["인증"]
      summary: "비밀번호 재설정 인증 요청 API"
      description: "본인 확인을 위한 인증 요청을 생성한다. 인증 수단은 별도 확정한다."
      operationId: "micon002"
      servers:
        - url: "{backendUrl}"
          description: "백엔드 서버"
          variables:
            backendUrl:
              default: "http://localhost:8080"
      security:
        []
      x-direction: "프 → 백"
      x-api-type: "API"
      x-work-status: "시작 전"
      x-backend-status: "미확인"
      x-frontend-status: "미확인"
      x-permission: "전체"
      x-auth-token: "불필요"
      responses:
        default:
          description: "응답 상태 코드와 스키마는 구현 시 확정"
  "/auth/password-reset-verifications":
    post:
      tags: ["인증"]
      summary: "비밀번호 재설정 본인 확인 API"
      description: "요청 식별자와 인증 코드를 검증하고 재설정 토큰을 발급한다."
      operationId: "micon003"
      servers:
        - url: "{backendUrl}"
          description: "백엔드 서버"
          variables:
            backendUrl:
              default: "http://localhost:8080"
      security:
        []
      x-direction: "프 → 백"
      x-api-type: "API"
      x-work-status: "시작 전"
      x-backend-status: "미확인"
      x-frontend-status: "미확인"
      x-permission: "인증 요청자"
      x-auth-token: "불필요·인증 코드 필요"
      responses:
        default:
          description: "응답 상태 코드와 스키마는 구현 시 확정"
  "/auth/password-resets":
    post:
      tags: ["인증"]
      summary: "비밀번호 재설정 API"
      description: "새 비밀번호를 설정하고 기존 비밀번호를 무효화한다. 기존 세션 폐기를 제안한다."
      operationId: "micon004"
      servers:
        - url: "{backendUrl}"
          description: "백엔드 서버"
          variables:
            backendUrl:
              default: "http://localhost:8080"
      security:
        - passwordResetAuth: []
      x-direction: "프 → 백"
      x-api-type: "API"
      x-work-status: "시작 전"
      x-backend-status: "미확인"
      x-frontend-status: "미확인"
      x-permission: "본인 확인 완료자"
      x-auth-token: "재설정 토큰"
      responses:
        default:
          description: "응답 상태 코드와 스키마는 구현 시 확정"
  "/auth/sessions":
    post:
      tags: ["인증"]
      summary: "이메일 로그인 API"
      description: "인증 정보를 검증하고 사용자 정보와 인증 토큰을 반환한다."
      operationId: "micon005"
      servers:
        - url: "{backendUrl}"
          description: "백엔드 서버"
          variables:
            backendUrl:
              default: "http://localhost:8080"
      security:
        []
      x-direction: "프 → 백"
      x-api-type: "API"
      x-work-status: "시작 전"
      x-backend-status: "미확인"
      x-frontend-status: "미확인"
      x-permission: "전체"
      x-auth-token: "불필요"
      responses:
