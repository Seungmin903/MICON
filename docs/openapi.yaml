    post:
      tags: ["음성 분석"]
      summary: "음성 분석 상태 및 결과 전달 API"
      description: "AI 서버가 발급한 jobId와 백엔드가 전달한 voiceAnalysisId를 함께 전달한다. 분석당 최종 결과 한 건을 전달하며, 종료 상태에 다시 도착한 콜백은 결과를 덮어쓰지 않고 멱등 처리한다."
      operationId: "micon012"
      servers:
        - url: "{backendUrl}"
          description: "백엔드 서버"
          variables:
            backendUrl:
              default: "http://localhost:8080"
      security:
        - serviceAuth: []
      x-event: "voice-analysis.updated"
      x-direction: "AI → 백"
      x-api-type: "Webhook"
      x-work-status: "진행 중"
      x-backend-status: "구현 완료"
      x-frontend-status: "해당 없음"
      x-permission: "AI 서비스"
      x-auth-token: "서비스 토큰"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceAnalysisCallbackRequest"
      responses:
        "200":
          description: "결과 저장 또는 중복 콜백 확인 완료"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceAnalysisCallbackApiResponse"
        "401":
          description: "AI 서비스 토큰 불일치"
        "409":
          description: "voiceAnalysisId·jobId 불일치 또는 처리할 수 없는 상태"
