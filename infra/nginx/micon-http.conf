# Loaded inside the nginx http context (sites-enabled).
# Avoid recording query strings, authorization headers, or request bodies.
log_format micon_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent $request_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/micon-access.log micon_safe;
    return 404;
}

server {
    listen 80;
    listen [::]:80;
    server_name j15b110.p.ssafy.io;
    server_tokens off;

    access_log /var/log/nginx/micon-access.log micon_safe;
    error_log /var/log/nginx/micon-error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;

    # Reserved for future ACME HTTP-01 certificate validation.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/micon-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # Edge-only liveness. This does NOT assert API, DB, or AI readiness.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"service":"micon-edge","status":"ok","scope":"nginx-only"}\n';
    }

    # Never expose files or forward to an unverified upstream during bootstrap.
    location / {
        default_type application/json;
        return 503 '{"service":"micon","status":"not_ready"}\n';
    }
}
