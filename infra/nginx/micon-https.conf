# Loaded inside nginx's http context. Enable this OR micon-http.conf, not both.
# Access logs omit query strings, authorization headers, and request bodies.
log_format micon_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent $request_time';

# One active blue/green backend is shared by the public API and the loopback-only
# AI catalog bridge. The included file contains exactly one `server` directive.
upstream micon_backend_active {
    include /etc/nginx/micon/backend-active.conf;
    keepalive 16;
}

# Tailscale Serve terminates the tailnet connection and forwards only to this
# loopback listener. Never bind this listener to a public interface.
server {
    listen 127.0.0.1:18080;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/micon-access.log micon_safe;
    error_log /var/log/nginx/micon-error.log warn;

    location = /internal/embedding-catalog/active {
        proxy_pass http://micon_backend_active;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/micon-access.log micon_safe;
    return 404;
}

server {
    listen 80;
    listen [::]:80;
    server_name j15b110.p.ssafy.io;
    server_tokens off;
    access_log /var/log/nginx/micon-access.log micon_safe;

    # Keep HTTP-01 accessible for unattended certificate renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/micon-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://j15b110.p.ssafy.io$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    server_tokens off;
    access_log /var/log/nginx/micon-access.log micon_safe;
    return 404;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name j15b110.p.ssafy.io;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/j15b110.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15b110.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:MiconTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/micon-access.log micon_safe;
    error_log /var/log/nginx/micon-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;

    # Edge-only liveness: does not assert API, DB, or AI readiness.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"service":"micon-edge","status":"ok","scope":"nginx-only"}\n';
    }

    # Management and AI-only routes are never exposed through the public edge.
    location = /actuator { return 404; }
    location ^~ /actuator/ { return 404; }
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location = /api/v1/actuator { return 404; }
    location ^~ /api/v1/actuator/ { return 404; }
    location = /api/v1/internal { return 404; }
    location ^~ /api/v1/internal/ { return 404; }

    # Reject dot-files before the generic API proxy is considered.
    location ~ (^|/)\. {
        return 404;
    }

    # The trailing slash removes only the public /api/v1/ prefix.
    location /api/v1/ {
        proxy_pass http://micon_backend_active/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 3s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
        client_max_body_size 27m;
    }

    # Keep non-API application routes unavailable.
    location / {
        default_type application/json;
        return 503 '{"service":"micon","status":"not_ready"}\n';
    }
}
