name: micon-gitlab-runner

services:
  runner:
    image: gitlab/gitlab-runner:alpine-v18.11.0
    container_name: micon-gitlab-runner
    restart: unless-stopped
    volumes:
      - /etc/gitlab-runner:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

