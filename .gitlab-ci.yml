stages:
  - verify
  - notify

default:
  image: python:3.13-alpine
  tags:
    - micon-protected
  interruptible: true

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - when: never

runtime-contract-tests:
  stage: verify
  tags:
    - $VERIFY_RUNNER_TAG
  timeout: 10 minutes
  script:
    - python --version
    - python -m unittest discover -s backend/contract_tests -v
    - python -m unittest discover -s infra/deploy -p 'test_*.py' -v
    - cd ai/recommend-server && python -m unittest tests.test_catalog_link -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      variables:
        VERIFY_RUNNER_TAG: micon-notify
    - if: '$CI_COMMIT_BRANCH == "develop"'
      variables:
        VERIFY_RUNNER_TAG: micon-protected

mysql-song-import:
  stage: verify
  tags:
    - $VERIFY_RUNNER_TAG
  timeout: 10 minutes
  image: eclipse-temurin:21-jdk-jammy@sha256:d48e921b83506f58910295b35fd02978c7f4c57fef41bceee6a460d7d97bc251
  services:
    - name: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
      alias: mysql
  variables:
    MYSQL_ROOT_PASSWORD: ci-root-password
    MYSQL_DATABASE: micon
    MYSQL_ROOT_HOST: '%'
    MICON_MYSQL_TEST: '1'
    MICON_TEST_DB_HOST: mysql
    MICON_TEST_DB_PASSWORD: ci-root-password
    GRADLE_USER_HOME: '$CI_PROJECT_DIR/.gradle-ci'
    GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx384m'
  script:
    - sh infra/mysql/verify-song-import.sh
    - cd backend && sh ./gradlew --no-daemon --max-workers=1 --console=plain test --tests '*EmbeddingCatalog*'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      variables:
        VERIFY_RUNNER_TAG: micon-notify
    - if: '$CI_COMMIT_BRANCH == "develop"'
      variables:
        VERIFY_RUNNER_TAG: micon-protected

embedding-catalog-tests:
  stage: verify
  tags:
    - $VERIFY_RUNNER_TAG
  timeout: 10 minutes
  services:
    - name: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
      alias: mysql
  variables:
    MYSQL_ROOT_PASSWORD: ci-root-password
    MYSQL_ROOT_HOST: '%'
    MICON_MYSQL_TEST: '1'
    MICON_TEST_DB_HOST: mysql
    MICON_TEST_DB_PASSWORD: ci-root-password
  script:
    - 'pip install --disable-pip-version-check --only-binary=:all: -r ai/embedding_catalog/requirements-test.txt'
    - python -m pytest ai/embedding_catalog/tests ai/catalog_media/tests -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      variables:
        VERIFY_RUNNER_TAG: micon-notify
    - if: '$CI_COMMIT_BRANCH == "develop"'
      variables:
        VERIFY_RUNNER_TAG: micon-protected

notify_mm_mr:
  stage: notify
  image: python:3.13-alpine
  tags:
    - micon-notify
  variables:
    GIT_STRATEGY: none
  script:
    - |
      python - <<'PY'
      import json
      import os
      import urllib.request

      text = (
          f"🙋‍♂️ **{os.environ['GITLAB_USER_NAME']} "
          f"({os.environ['GITLAB_USER_LOGIN']})** opened or updated merge request "
          f"**!{os.environ['CI_MERGE_REQUEST_IID']}**\n\n"
          f"**{os.environ['CI_MERGE_REQUEST_TITLE']}**\n\n"
          f"🌿 **Source**: `{os.environ['CI_MERGE_REQUEST_SOURCE_BRANCH_NAME']}`\n"
          f"🎯 **Target**: `{os.environ['CI_MERGE_REQUEST_TARGET_BRANCH_NAME']}`\n"
          f"📦 **Project**: {os.environ['CI_PROJECT_PATH']}\n"
          f"🔗 **Link**: {os.environ['CI_MERGE_REQUEST_PROJECT_URL']}"
          f"/-/merge_requests/{os.environ['CI_MERGE_REQUEST_IID']}"
      )
      body = json.dumps({"text": text}, ensure_ascii=False).encode("utf-8")
      request = urllib.request.Request(
          os.environ["MM_WEBHOOK_URL"],
          data=body,
          headers={"Content-Type": "application/json; charset=utf-8"},
          method="POST",
      )
      with urllib.request.urlopen(request, timeout=15) as response:
          print(f"Mattermost webhook response: {response.status}")
      PY
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
